name: Deploy static site to Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'home.html'
      - 'styles.css'
      - 'app.js'
      - 'config.js'
      - 'pdf.mjs'
      - 'pdf.worker.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p site
          cp index.html home.html styles.css app.js config.js site/
          cp pdf.mjs pdf.worker.mjs site/ || true

      - name: Inject Supabase config from secrets (optional)
        shell: bash
        env:
          SUPABASE_EDGE_URL: ${{ secrets.SUPABASE_EDGE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "${SUPABASE_EDGE_URL}" ] && [ -n "${SUPABASE_ANON_KEY}" ]; then
            echo "Writing config.js from secrets"
            cat > site/config.js << EOF
            // Generated by GitHub Actions from repository secrets
            window.SUPABASE_EDGE_URL = "${SUPABASE_EDGE_URL}";
            window.SUPABASE_ANON_KEY = "${SUPABASE_ANON_KEY}";
            EOF
          else
            echo "Secrets not set; using checked-in config.js"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
